<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darshan Naidu — Kinetic Editorial Typography</title>
    <link href="/assets/images/672d25251d3eb0249521c21b_Fav%20icon.png" rel="shortcut icon" type="image/x-icon">
    <!-- GSAP 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hero-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            background-color: #080808;
        }

        .word-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(32px, 5.2vw, 76px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1;
            white-space: nowrap;
            color: #ffffff;
            position: relative;
        }

        .char-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            vertical-align: middle;
            height: 1.22em;
            will-change: width, margin;
        }

        .char-space {
            display: inline-block;
            width: 0.32em;
            pointer-events: none;
        }

        .char-glyph {
            display: inline-block;
            line-height: 1;
            color: #ffffff;
            will-change: transform, opacity;
            pointer-events: none;
        }

        .image-tile {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            border-radius: 20%;
            overflow: hidden;
            pointer-events: none;
            will-change: transform, opacity, width, height;
            background-color: #080808;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 5;
        }

        .image-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 20%;
        }

        /* Subtle interactive hints */
        .controls-hint {
            position: absolute;
            bottom: 32px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .char-slot, .char-glyph, .image-tile {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="hero-stage">
        <div id="word" class="word-container" aria-label="Darshan Naidu">
            <!-- Darshan (indices 0 to 6) -->
            <span class="char-slot" data-index="0" data-char="D"><span class="char-glyph">D</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="1" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="2" data-char="r"><span class="char-glyph">r</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="3" data-char="s"><span class="char-glyph">s</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="4" data-char="h"><span class="char-glyph">h</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="5" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="6" data-char="n"><span class="char-glyph">n</span><div class="image-tile"><img src="" alt=""></div></span>

            <!-- Space separator -->
            <span class="char-space">&nbsp;</span>

            <!-- Naidu (indices 7 to 11) -->
            <span class="char-slot" data-index="7" data-char="N"><span class="char-glyph">N</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="8" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="9" data-char="i"><span class="char-glyph">i</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="10" data-char="d"><span class="char-glyph">d</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="11" data-char="u"><span class="char-glyph">u</span><div class="image-tile"><img src="" alt=""></div></span>
        </div>

        <div class="controls-hint">Click to replay • Space to pause</div>
    </main>

    <script>
        // High-aesthetic photography & portfolio images
        const IMAGES = {
            water:     '/assets/images/morph/card_water.png',
            stairs:    '/assets/images/morph/card_stairs.png',
            runner:    '/assets/images/morph/card_runner.png',
            flower:    '/assets/images/morph/card_flower.png',
            ferry:     '/assets/images/morph/card_ferry.png',
            tennis:    '/assets/images/morph/card_tennis.png',
            stadium:   '/assets/images/morph/card_stadium.png',
            taj:       '/assets/images/work/taj.jpg',
            hawa:      '/assets/images/work/hawa-mahal.jpg',
            kolkata:   '/assets/images/work/kolkata.jpg',
            mind:      '/assets/images/darshan_mind.jpg',
            portrait:  '/assets/images/darshan.jpeg',
            basilica:  '/assets/images/68ac19dd1de59151886116ee_basilica_img_2.avif',
            studio:    '/assets/images/IMG_E1906_Original.jpg'
        };

        // Preload all photographic assets
        function preloadAssets(urls, callback) {
            let loaded = 0;
            const keys = Object.keys(urls);
            const total = keys.length;
            keys.forEach(k => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded >= total) callback();
                };
                img.src = urls[k];
            });
        }

        const slots = document.querySelectorAll('.char-slot');
        let naturalWidths = [];
        let tileDimension = 0;
        let masterTimeline = null;

        // Measure natural rendered character widths
        function measureLayout() {
            naturalWidths = [];
            slots.forEach(slot => {
                const glyph = slot.querySelector('.char-glyph');
                slot.style.width = 'auto';
                slot.style.margin = '0';
                glyph.style.transform = 'none';
                glyph.style.opacity = '1';
                const rect = glyph.getBoundingClientRect();
                naturalWidths.push(rect.width);
                slot.style.width = `${rect.width}px`;
            });

            // Square tile matches line height
            const sampleSlot = slots[0];
            const sampleRect = sampleSlot.getBoundingClientRect();
            tileDimension = Math.round(sampleRect.height);
        }

        // Helper to animate slot state (glyph vs card tile)
        function setSlotState(tl, index, config, position) {
            const slot = slots[index];
            const glyph = slot.querySelector('.char-glyph');
            const tile = slot.querySelector('.image-tile');
            const img = tile.querySelector('img');

            const naturalW = naturalWidths[index];
            const targetW = config.active ? tileDimension : naturalW;
            const duration = config.duration || 0.44;
            const ease = config.ease || "power2.out";

            if (config.active && config.image) {
                // Set image source at exact position in timeline
                tl.set(img, { attr: { src: config.image } }, position);

                // Expand slot and fade out glyph
                tl.to(slot, {
                    width: targetW,
                    marginRight: 4,
                    marginLeft: 4,
                    duration: duration,
                    ease: ease
                }, position);

                tl.to(glyph, {
                    opacity: 0,
                    scale: 0.15,
                    duration: duration * 0.7,
                    ease: "power2.in"
                }, position);

                tl.set(tile, {
                    width: tileDimension,
                    height: tileDimension
                }, position);

                tl.to(tile, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position);

            } else {
                // Revert to typography
                tl.to(tile, {
                    opacity: 0,
                    scale: 0.5,
                    duration: duration * 0.75,
                    ease: "power2.in"
                }, position);

                tl.to(slot, {
                    width: targetW,
                    marginRight: 0,
                    marginLeft: 0,
                    duration: duration,
                    ease: ease
                }, position);

                tl.to(glyph, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position + (duration * 0.2));
            }
        }

        // Micro image-swap on an already active card
        function swapSlotImage(tl, index, newImage, position, duration = 0.32) {
            const slot = slots[index];
            const tile = slot.querySelector('.image-tile');
            const img = tile.querySelector('img');

            tl.to(tile, {
                scale: 0.88,
                duration: duration * 0.5,
                ease: "power1.in"
            }, position);

            tl.set(img, { attr: { src: newImage } }, position + (duration * 0.5));

            tl.to(tile, {
                scale: 1,
                duration: duration * 0.5,
                ease: "back.out(1.4)"
            }, position + (duration * 0.5));
        }

        // Build the relaxed, editorial timeline for "Darshan Naidu":
        // D(0), a(1), r(2), s(3), h(4), a(5), n(6)  [space]  N(7), a(8), i(9), d(10), u(11)
        // Strictly max 1 to 2 letters active at any time, never 4 or 5!
        function buildTimeline() {
            if (masterTimeline) {
                masterTimeline.kill();
            }

            measureLayout();

            const tl = gsap.timeline({
                repeat: -1,
                repeatDelay: 1.6,
                defaults: { ease: "power2.out" }
            });

            // 0.00s - 0.50s: Clean Opening (Stationary white Darshan Naidu on #080808)
            slots.forEach((slot, idx) => {
                const glyph = slot.querySelector('.char-glyph');
                const tile = slot.querySelector('.image-tile');
                tl.set(slot, { width: naturalWidths[idx], margin: 0 }, 0);
                tl.set(glyph, { opacity: 1, scale: 1 }, 0);
                tl.set(tile, { opacity: 0, scale: 0.6 }, 0);
            });

            // ----------------------------------------------------
            // Beat 1 (0.50s - 1.45s): 1 letter opens (i in Naidu, index 9)
            // ----------------------------------------------------
            setSlotState(tl, 9, { active: true, image: IMAGES.water, duration: 0.46 }, 0.50);

            // ----------------------------------------------------
            // Beat 2 (1.45s - 2.50s): 2 letters across both words
            // i resolves; r (index 2) & d (index 10) bloom
            // ----------------------------------------------------
            setSlotState(tl, 9, { active: false, duration: 0.40 }, 1.45);
            setSlotState(tl, 2, { active: true, image: IMAGES.taj, duration: 0.46 }, 1.50);
            setSlotState(tl, 10, { active: true, image: IMAGES.stairs, duration: 0.46 }, 1.58);

            // ----------------------------------------------------
            // Beat 3 (2.50s - 3.55s): 1 letter with dynamic photo swap
            // r and d resolve; a (index 5) blooms into flower, then pops to runner
            // ----------------------------------------------------
            setSlotState(tl, 10, { active: false, duration: 0.38 }, 2.50);
            setSlotState(tl, 2, { active: false, duration: 0.38 }, 2.52);
            setSlotState(tl, 5, { active: true, image: IMAGES.flower, duration: 0.44 }, 2.56);
            swapSlotImage(tl, 5, IMAGES.runner, 3.00, 0.30);

            // ----------------------------------------------------
            // Beat 4 (3.55s - 4.60s): 2 letters flanking the space
            // a resolves; h (index 4) & N (index 7) bloom into hawa & mind
            // ----------------------------------------------------
            setSlotState(tl, 5, { active: false, duration: 0.40 }, 3.55);
            setSlotState(tl, 4, { active: true, image: IMAGES.hawa, duration: 0.46 }, 3.60);
            setSlotState(tl, 7, { active: true, image: IMAGES.mind, duration: 0.46 }, 3.68);

            // ----------------------------------------------------
            // Beat 5 (4.60s - 5.65s): 1 letter solo spotlight
            // h and N resolve; s (index 3) blooms into Darshan's portrait
            // ----------------------------------------------------
            setSlotState(tl, 4, { active: false, duration: 0.40 }, 4.60);
            setSlotState(tl, 7, { active: false, duration: 0.40 }, 4.60);
            setSlotState(tl, 3, { active: true, image: IMAGES.portrait, duration: 0.48 }, 4.65);

            // ----------------------------------------------------
            // Beat 6 (5.65s - 6.25s): Soft resolve to clean white text
            // ----------------------------------------------------
            setSlotState(tl, 3, { active: false, duration: 0.44 }, 5.65);

            // 6.25s - 7.80s: Resting hold of complete white word before repeat
            tl.to({}, { duration: 1.55 }, 6.25);

            masterTimeline = tl;
        }

        // Initialize once assets are preloaded
        preloadAssets(IMAGES, () => {
            buildTimeline();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('seek')) {
                masterTimeline.pause();
                masterTimeline.seek(parseFloat(urlParams.get('seek')));
            }
        });

        // Recalculate accurately on window resize
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const progress = masterTimeline ? masterTimeline.progress() : 0;
                buildTimeline();
                if (masterTimeline) masterTimeline.progress(progress);
            }, 120);
        });

        // Keyboard & click controls: Space = pause/play, Click = replay
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (masterTimeline) {
                    if (masterTimeline.paused()) masterTimeline.play();
                    else masterTimeline.pause();
                }
            }
        });

        document.querySelector('.hero-stage').addEventListener('click', () => {
            if (masterTimeline) masterTimeline.restart();
        });
    </script>
</body>
</html>
