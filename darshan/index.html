<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARSHAN — Kinetic Typography Loader</title>
    <link href="/assets/images/672d25251d3eb0249521c21b_Fav%20icon.png" rel="shortcut icon" type="image/x-icon">
    <!-- GSAP 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hero-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            background-color: #080808;
        }

        .word-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(38px, 6.2vw, 84px);
            font-weight: 500;
            letter-spacing: -0.015em;
            line-height: 1;
            white-space: nowrap;
            color: #ffffff;
            position: relative;
        }

        .char-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            vertical-align: middle;
            height: 1.22em;
            will-change: width, margin;
        }

        .char-glyph {
            display: inline-block;
            line-height: 1;
            color: #ffffff;
            will-change: transform, opacity;
            pointer-events: none;
        }

        .image-tile {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            border-radius: 20%;
            overflow: hidden;
            pointer-events: none;
            will-change: transform, opacity, width, height;
            background-color: #080808;
            z-index: 5;
        }

        .image-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 20%;
        }

        @media (prefers-reduced-motion: reduce) {
            .char-slot, .char-glyph, .image-tile {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="hero-stage">
        <div id="word" class="word-container" aria-label="DARSHAN">
            <!-- DARSHAN (7 letters: D(0), A(1), R(2), S(3), H(4), A(5), N(6)) -->
            <span class="char-slot" data-index="0" data-char="D"><span class="char-glyph">D</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="1" data-char="A"><span class="char-glyph">A</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="2" data-char="R"><span class="char-glyph">R</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="3" data-char="S"><span class="char-glyph">S</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="4" data-char="H"><span class="char-glyph">H</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="5" data-char="A"><span class="char-glyph">A</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="6" data-char="N"><span class="char-glyph">N</span><div class="image-tile"><img src="" alt=""></div></span>
        </div>
    </main>

    <script>
        // Darshan Authentic Photography & Design Works
        const IMAGES = {
            darshan_mind:     '/assets/images/darshan_mind.jpg',
            taj:              '/assets/images/work/taj.jpg',
            basilica:         '/assets/images/68ac19dd1de59151886116ee_basilica_img_2.avif',
            darshan_studio:   '/assets/images/IMG_E1906_Original.jpg',
            hawa_mahal:       '/assets/images/work/hawa-mahal.jpg',
            kolkata:          '/assets/images/work/kolkata.jpg',
            darshan_portrait: '/assets/images/darshan.jpeg'
        };

        // Preload all photographic assets to prevent frame drops or flickering
        function preloadAssets(urls, callback) {
            let loaded = 0;
            const keys = Object.keys(urls);
            const total = keys.length;
            keys.forEach(k => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded >= total) callback();
                };
                img.src = urls[k];
            });
        }

        const slots = document.querySelectorAll('.char-slot');
        let naturalWidths = [];
        let tileDimension = 0;
        let masterTimeline = null;

        // Measure natural rendered character widths
        function measureLayout() {
            naturalWidths = [];
            slots.forEach(slot => {
                const glyph = slot.querySelector('.char-glyph');
                slot.style.width = 'auto';
                slot.style.margin = '0';
                glyph.style.transform = 'none';
                glyph.style.opacity = '1';
                const rect = glyph.getBoundingClientRect();
                naturalWidths.push(rect.width);
                slot.style.width = `${rect.width}px`;
            });

            // Tile size matches the character line height
            const sampleSlot = slots[0];
            const sampleRect = sampleSlot.getBoundingClientRect();
            tileDimension = Math.round(sampleRect.height);
        }

        // Helper to animate slot state (glyph vs tile) via GSAP
        function setSlotState(tl, index, config, position) {
            const slot = slots[index];
            const glyph = slot.querySelector('.char-glyph');
            const tile = slot.querySelector('.image-tile');
            const img = tile.querySelector('img');

            const naturalW = naturalWidths[index];
            const targetW = config.active ? tileDimension : naturalW;
            const duration = config.duration || 0.32;
            const ease = config.ease || "power2.out";

            if (config.active && config.image) {
                // Set image source at exact position in timeline
                tl.set(img, { attr: { src: config.image } }, position);

                // Expand slot and fade out glyph
                tl.to(slot, {
                    width: targetW,
                    marginRight: 4,
                    marginLeft: 4,
                    duration: duration,
                    ease: ease
                }, position);

                tl.to(glyph, {
                    opacity: 0,
                    scale: 0.15,
                    duration: duration * 0.7,
                    ease: "power2.in"
                }, position);

                tl.set(tile, {
                    width: tileDimension,
                    height: tileDimension
                }, position);

                tl.to(tile, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position);

            } else {
                // Revert to typography
                tl.to(tile, {
                    opacity: 0,
                    scale: 0.5,
                    duration: duration * 0.75,
                    ease: "power2.in"
                }, position);

                tl.to(slot, {
                    width: targetW,
                    marginRight: 0,
                    marginLeft: 0,
                    duration: duration,
                    ease: ease
                }, position);

                tl.to(glyph, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position + (duration * 0.2));
            }
        }

        // Build 3.0s Loader Timeline for DARSHAN:
        // D(0), A(1), R(2), S(3), H(4), A(5), N(6)
        // Sequence requested by user:
        // 1) A - 2 (index 5)
        // 2) then h (index 4)
        // 3) then N (index 6) and r (index 2)
        // 4) and d (index 0) and a (index 1)
        // 5) S (index 3) solo
        // Total loading time: exactly 3 seconds!
        function buildTimeline() {
            if (masterTimeline) {
                masterTimeline.kill();
            }

            measureLayout();

            const tl = gsap.timeline({
                repeat: -1,
                repeatDelay: 1.2,
                defaults: { ease: "power2.out" }
            });

            // 0.00s - 0.25s: Clean Opening (Stationary white DARSHAN on black)
            slots.forEach((slot, idx) => {
                const glyph = slot.querySelector('.char-glyph');
                const tile = slot.querySelector('.image-tile');
                tl.set(slot, { width: naturalWidths[idx], margin: 0 }, 0);
                tl.set(glyph, { opacity: 1, scale: 1 }, 0);
                tl.set(tile, { opacity: 0, scale: 0.6 }, 0);
            });

            // ----------------------------------------------------
            // Step 1: "A - 2" (index 5) blooms (0.28s - 0.72s)
            // ----------------------------------------------------
            setSlotState(tl, 5, { active: true, image: IMAGES.kolkata, duration: 0.32 }, 0.28);

            // ----------------------------------------------------
            // Step 2: "then h" (index 4) blooms, A-2 closes (0.72s - 1.18s)
            // ----------------------------------------------------
            setSlotState(tl, 5, { active: false, duration: 0.28 }, 0.72);
            setSlotState(tl, 4, { active: true, image: IMAGES.hawa_mahal, duration: 0.32 }, 0.76);

            // ----------------------------------------------------
            // Step 3: "then N and r" (indices 6 and 2) bloom (1.18s - 1.70s)
            // ----------------------------------------------------
            setSlotState(tl, 4, { active: false, duration: 0.28 }, 1.18);
            setSlotState(tl, 6, { active: true, image: IMAGES.darshan_portrait, duration: 0.32 }, 1.22);
            setSlotState(tl, 2, { active: true, image: IMAGES.basilica, duration: 0.32 }, 1.28);

            // ----------------------------------------------------
            // Step 4: "and d and a" (indices 0 and 1) bloom (1.70s - 2.22s)
            // ----------------------------------------------------
            setSlotState(tl, 6, { active: false, duration: 0.28 }, 1.70);
            setSlotState(tl, 2, { active: false, duration: 0.28 }, 1.70);
            setSlotState(tl, 0, { active: true, image: IMAGES.darshan_mind, duration: 0.32 }, 1.74);
            setSlotState(tl, 1, { active: true, image: IMAGES.taj, duration: 0.32 }, 1.80);

            // ----------------------------------------------------
            // Step 5: "S" (index 3) solo bloom & hold (2.22s - 2.68s)
            // ----------------------------------------------------
            setSlotState(tl, 0, { active: false, duration: 0.28 }, 2.22);
            setSlotState(tl, 1, { active: false, duration: 0.28 }, 2.22);
            setSlotState(tl, 3, { active: true, image: IMAGES.darshan_studio, duration: 0.32 }, 2.26);

            // ----------------------------------------------------
            // Final Reset: clean white DARSHAN (2.68s - 3.00s)
            // ----------------------------------------------------
            setSlotState(tl, 3, { active: false, duration: 0.30 }, 2.68);

            // Text hold until 3.00s before repeatDelay
            tl.to({}, { duration: 0.32 }, 2.98);

            masterTimeline = tl;
        }

        // Initialize once assets are preloaded
        preloadAssets(IMAGES, () => {
            buildTimeline();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('seek')) {
                masterTimeline.pause();
                masterTimeline.seek(parseFloat(urlParams.get('seek')));
            }
        });

        // Recalculate accurately on resize
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const progress = masterTimeline ? masterTimeline.progress() : 0;
                buildTimeline();
                if (masterTimeline) masterTimeline.progress(progress);
            }, 120);
        });

        // Interactive controls: Space = pause/play, Click = replay
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (masterTimeline) {
                    if (masterTimeline.paused()) masterTimeline.play();
                    else masterTimeline.pause();
                }
            }
        });

        document.querySelector('.hero-stage').addEventListener('click', () => {
            if (masterTimeline) masterTimeline.restart();
        });
    </script>
</body>
</html>
