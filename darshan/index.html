<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darshan — Kinetic Morph Animation</title>
    <meta name="description" content="Apple-style letter-to-image morph animation for Darshan, featuring smooth fluid physics, sequential letter transformations, and curated visual direction.">
    <link href="/assets/images/672d25251d3eb0249521c21b_Fav%20icon.png" rel="shortcut icon" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple-style spring easing */
        .char-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: width 0.46s cubic-bezier(0.25, 1, 0.5, 1),
                        height 0.46s cubic-bezier(0.25, 1, 0.5, 1),
                        margin 0.46s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.46s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            cursor: pointer;
            vertical-align: middle;
        }

        .char-text {
            transition: opacity 0.28s ease, transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
            display: inline-block;
            user-select: none;
            line-height: 1;
        }

        .char-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.65);
            opacity: 0;
            border-radius: 22%;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.85);
            transition: opacity 0.32s ease,
                        transform 0.46s cubic-bezier(0.25, 1, 0.5, 1),
                        width 0.46s cubic-bezier(0.25, 1, 0.5, 1),
                        height 0.46s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            background-color: #000000;
            z-index: 5;
        }

        .char-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 22%;
        }

        /* Active State when letter becomes photo card */
        .char-slot.is-card .char-text {
            opacity: 0 !important;
            visibility: hidden !important;
            transform: scale(0) !important;
            pointer-events: none;
        }

        .char-slot.is-card .char-image {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .char-slot.is-card:hover .char-image {
            transform: translate(-50%, -50%) scale(1.06);
            z-index: 10;
        }

        .glass-panel {
            background: rgba(28, 28, 30, 0.78);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        /* Scrubber styling */
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-between select-none m-0 p-0 bg-black text-white relative">

    <!-- Top Navigation -->
    <header class="w-full px-8 py-5 flex items-center justify-between z-30">
        <a href="/" class="flex items-center gap-2 group text-neutral-400 hover:text-white transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="font-medium text-xs tracking-wider uppercase font-mono">Back to Portfolio</span>
        </a>

        <!-- Pattern Mode Pills -->
        <div class="flex items-center gap-1.5 glass-panel p-1 rounded-full text-xs">
            <button id="mode-seq" onclick="setPatternMode('sequential')" class="px-3.5 py-1 rounded-full transition font-medium bg-white text-black">
                1 by 1 (Sequential)
            </button>
            <button id="mode-wave" onclick="setPatternMode('wave')" class="px-3.5 py-1 rounded-full transition font-medium text-neutral-400 hover:text-white">
                Video Pattern (Wave)
            </button>
        </div>

        <!-- Image Set Toggle -->
        <div class="flex items-center gap-2 text-xs">
            <button id="theme-btn" onclick="toggleImageSet()" class="glass-panel px-3.5 py-1.5 rounded-full text-neutral-300 hover:text-white transition flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span id="theme-label">Visual Set: Apple Aesthetic</span>
            </button>
        </div>
    </header>

    <!-- Main Display Stage (Dead-Center Just Like the Reference Video) -->
    <main class="relative flex-1 w-full flex items-center justify-center px-4 overflow-hidden">
        
        <!-- Animated Word Container -->
        <div id="word-container" class="flex items-center justify-center text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-semibold tracking-tight whitespace-nowrap leading-none select-none">
            
            <!-- D (index 0) -->
            <div class="char-slot" data-char="D" data-index="0">
                <span class="char-text">D</span>
                <div class="char-image"></div>
            </div>

            <!-- a (index 1) -->
            <div class="char-slot" data-char="a" data-index="1">
                <span class="char-text">a</span>
                <div class="char-image"></div>
            </div>

            <!-- r (index 2) -->
            <div class="char-slot" data-char="r" data-index="2">
                <span class="char-text">r</span>
                <div class="char-image"></div>
            </div>

            <!-- s (index 3) -->
            <div class="char-slot" data-char="s" data-index="3">
                <span class="char-text">s</span>
                <div class="char-image"></div>
            </div>

            <!-- h (index 4) -->
            <div class="char-slot" data-char="h" data-index="4">
                <span class="char-text">h</span>
                <div class="char-image"></div>
            </div>

            <!-- a (index 5) -->
            <div class="char-slot" data-char="a" data-index="5">
                <span class="char-text">a</span>
                <div class="char-image"></div>
            </div>

            <!-- n (index 6) -->
            <div class="char-slot" data-char="n" data-index="6">
                <span class="char-text">n</span>
                <div class="char-image"></div>
            </div>

        </div>

    </main>

    <!-- Interactive Timebar & Controls (Apple Celebrations Style) -->
    <footer class="w-full max-w-2xl px-6 pb-8 pt-2 flex flex-col gap-4 z-20 mx-auto">
        
        <!-- Scrubber Progress Bar -->
        <div class="flex items-center gap-4">
            <span id="time-display" class="font-mono text-xs text-neutral-400 w-12 text-right">00:00</span>
            <input type="range" id="scrubber" min="0" max="5000" value="0" step="10" 
                   class="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-white hover:bg-neutral-700 transition-colors">
            <span id="total-time-display" class="font-mono text-xs text-neutral-500 w-12">00:05</span>
        </div>

        <!-- Controls Bar -->
        <div class="flex items-center justify-between glass-panel px-6 py-3 rounded-full">
            
            <div class="flex items-center gap-2">
                <!-- Play / Pause -->
                <button id="play-btn" onclick="togglePlay()" class="p-2 text-white hover:text-neutral-300 transition" title="Play / Pause">
                    <svg id="play-icon" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <!-- Step Back -->
                <button onclick="stepFrame(-600)" class="p-2 text-neutral-400 hover:text-white transition" title="Previous Frame">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <!-- Step Forward -->
                <button onclick="stepFrame(600)" class="p-2 text-neutral-400 hover:text-white transition" title="Next Frame">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                </button>
            </div>

            <!-- Current Active Phase Indicator -->
            <div id="phase-badge" class="text-xs font-medium tracking-wider text-neutral-200 bg-white/10 px-3.5 py-1.5 rounded-full uppercase truncate max-w-[220px] text-center border border-white/10">
                1 by 1: Letter D
            </div>

            <!-- Loop Toggle -->
            <button id="loop-toggle" onclick="toggleLoop()" class="text-xs font-medium text-white bg-white/20 px-3.5 py-1.5 rounded-full hover:bg-white/30 transition">
                Loop: ON
            </button>
        </div>
    </footer>

    <!-- Video & Vector Visual Assets & Fluid Choreography -->
    <script>
        // Set 1: Exact High-Contrast Aesthetic Images extracted from the Reference Video
        const ASSETS_VIDEO = {
            portrait: `<img src="/assets/images/morph/card_portrait.png" alt="Portrait">`,
            flower: `<img src="/assets/images/morph/card_flower.png" alt="Botanical Flower">`,
            stadium: `<img src="/assets/images/morph/card_stadium.png" alt="Stadium">`,
            runner: `<img src="/assets/images/morph/card_runner.png" alt="Runner on Track">`,
            water: `<img src="/assets/images/morph/card_water.png" alt="Crystal Water">`,
            stairs: `<img src="/assets/images/morph/card_stairs.png" alt="Yellow Stairs">`,
            ferry: `<img src="/assets/images/morph/card_ferry.png" alt="Ferry Ocean">`,
            tennis: `<img src="/assets/images/morph/card_tennis.png" alt="Tennis Court">`
        };

        // Set 2: Darshan Creative Portfolio Works & Portraits
        const ASSETS_PORTFOLIO = {
            portrait: `<img src="/assets/images/darshan_mind.jpg" alt="Darshan Mind">`,
            flower: `<img src="/assets/images/work/taj.jpg" alt="Taj Mahal Craft">`,
            stadium: `<img src="/assets/images/IMG_E1906_Original.jpg" alt="Darshan Studio">`,
            runner: `<img src="/assets/images/work/hawa-mahal.jpg" alt="Hawa Mahal Design">`,
            water: `<img src="/assets/images/68ac19dd1de59151886116ee_basilica_img_2.avif" alt="Basilica">`,
            stairs: `<img src="/assets/images/work/kolkata.jpg" alt="Kolkata Visual">`,
            ferry: `<img src="/assets/images/680806a6fe42f1c31342a791_project_teaser_img_1.gif" alt="Motion Graphic">`,
            tennis: `<img src="/assets/images/darshan.jpeg" alt="Darshan Profile">`
        };

        let currentImageSet = 'video'; // 'video' or 'portfolio'
        function getAssets() {
            return currentImageSet === 'video' ? ASSETS_VIDEO : ASSETS_PORTFOLIO;
        }

        // PATTERN 1: 1 Letter 1 Time (Smooth Sequential Wave across D - a - r - s - h - a - n)
        // Exactly what user asked: "1 letter 1 one time and some good pattern"
        function getSequentialTimeline() {
            const A = getAssets();
            return [
                {
                    time: 0,
                    badge: "Letter 1: D",
                    active: { 0: A.portrait }
                },
                {
                    time: 650,
                    badge: "Letter 2: a",
                    active: { 1: A.flower }
                },
                {
                    time: 1300,
                    badge: "Letter 3: r",
                    active: { 2: A.runner }
                },
                {
                    time: 1950,
                    badge: "Letter 4: s",
                    active: { 3: A.water }
                },
                {
                    time: 2600,
                    badge: "Letter 5: h",
                    active: { 4: A.stairs }
                },
                {
                    time: 3250,
                    badge: "Letter 6: a",
                    active: { 5: A.ferry }
                },
                {
                    time: 3900,
                    badge: "Letter 7: n",
                    active: { 6: A.tennis }
                },
                {
                    time: 4600,
                    badge: "Resolved: Darshan",
                    active: {} // Reverts smoothly to typography
                }
            ];
        }

        // PATTERN 2: Video Pattern (Shifting Wave from the 150-frame reference video)
        // Frame analysis: pair -> 5 cards -> shift left trio -> solo card -> resolve
        function getWaveTimeline() {
            const A = getAssets();
            return [
                {
                    time: 0,
                    badge: "Phase 1: i, o (Center Pair)",
                    active: {
                        3: A.ferry,   // s -> Ferry
                        4: A.tennis   // h -> Tennis
                    }
                },
                {
                    time: 1100,
                    badge: "Phase 2: r, a, t, i, o (Five Center Cards)",
                    active: {
                        1: A.runner,  // a -> Runner
                        2: A.water,   // r -> Water
                        3: A.stairs,  // s -> Yellow Stairs
                        4: A.ferry,   // h -> Ferry
                        5: A.tennis   // a -> Tennis
                    }
                },
                {
                    time: 2300,
                    badge: "Phase 3: e, l, e (Left Shift Trio)",
                    active: {
                        0: A.portrait,// D -> Portrait
                        1: A.flower,  // a -> Flower
                        2: A.stadium  // r -> Stadium
                    }
                },
                {
                    time: 3500,
                    badge: "Phase 4: Solo Card D",
                    active: {
                        0: A.portrait // D -> Portrait
                    }
                },
                {
                    time: 4400,
                    badge: "Phase 5: Resolved",
                    active: {} // Reverts cleanly to Darshan text
                }
            ];
        }

        let patternMode = 'sequential'; // 'sequential' or 'wave'
        let TIMELINE = getSequentialTimeline();
        let totalDuration = 5200; // 5.2 seconds

        // Player State
        let currentTime = 0;
        let isPlaying = true;
        let isLooping = true;
        let lastTimestamp = null;
        const slots = document.querySelectorAll('.char-slot');

        // Apple Pro Card Sizing: smooth, proportionate to viewport
        function calculateCardSize() {
            const w = window.innerWidth;
            if (w < 480) return { size: 52, fontWidth: '0.62em', margin: '0 2px' };
            if (w < 640) return { size: 68, fontWidth: '0.65em', margin: '0 3px' };
            if (w < 768) return { size: 88, fontWidth: '0.65em', margin: '0 4px' };
            if (w < 1024) return { size: 108, fontWidth: '0.65em', margin: '0 5px' };
            if (w < 1280) return { size: 124, fontWidth: '0.65em', margin: '0 6px' };
            return { size: 136, fontWidth: '0.65em', margin: '0 8px' };
        }

        const currentSlotContent = {};

        function updateScene(timeMs) {
            // Find current frame in TIMELINE
            let currentFrame = TIMELINE[0];
            for (let i = TIMELINE.length - 1; i >= 0; i--) {
                if (timeMs >= TIMELINE[i].time) {
                    currentFrame = TIMELINE[i];
                    break;
                }
            }

            const cardConfig = calculateCardSize();

            slots.forEach((slot) => {
                const idx = parseInt(slot.dataset.index, 10);
                const imgContainer = slot.querySelector('.char-image');
                const imageHTML = currentFrame.active[idx];

                if (imageHTML) {
                    slot.classList.add('is-card');
                    slot.style.width = `${cardConfig.size}px`;
                    slot.style.height = `${cardConfig.size}px`;
                    slot.style.margin = cardConfig.margin;
                    
                    imgContainer.style.width = `${cardConfig.size}px`;
                    imgContainer.style.height = `${cardConfig.size}px`;

                    if (currentSlotContent[idx] !== imageHTML) {
                        imgContainer.innerHTML = imageHTML;
                        currentSlotContent[idx] = imageHTML;
                    }
                } else {
                    slot.classList.remove('is-card');
                    slot.style.width = cardConfig.fontWidth;
                    slot.style.height = 'auto';
                    slot.style.margin = '0';
                    currentSlotContent[idx] = null;
                }
            });

            // Update UI
            const scrubber = document.getElementById('scrubber');
            if (document.activeElement !== scrubber) {
                scrubber.value = timeMs;
            }
            document.getElementById('phase-badge').innerText = currentFrame.badge;
            
            const seconds = Math.floor(timeMs / 1000);
            const millis = Math.floor((timeMs % 1000) / 10);
            document.getElementById('time-display').innerText = 
                `0${seconds}:${millis < 10 ? '0' : ''}${millis}`;
        }

        function animationLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (isPlaying) {
                currentTime += delta;
                if (currentTime >= totalDuration) {
                    if (isLooping) {
                        currentTime = 0;
                    } else {
                        currentTime = totalDuration;
                        pause();
                    }
                }
                updateScene(currentTime);
            }

            requestAnimationFrame(animationLoop);
        }

        function play() {
            isPlaying = true;
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
            if (currentTime >= totalDuration) currentTime = 0;
        }

        function pause() {
            isPlaying = false;
            document.getElementById('play-icon').classList.remove('hidden');
            document.getElementById('pause-icon').classList.add('hidden');
        }

        function togglePlay() {
            if (isPlaying) pause();
            else play();
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loop-toggle');
            btn.innerText = `Loop: ${isLooping ? 'ON' : 'OFF'}`;
            btn.className = `text-xs font-medium px-3.5 py-1.5 rounded-full transition ${isLooping ? 'text-white bg-white/20' : 'text-neutral-400 bg-white/5'}`;
        }

        function stepFrame(deltaMs) {
            pause();
            currentTime = Math.max(0, Math.min(totalDuration, currentTime + deltaMs));
            updateScene(currentTime);
        }

        function setPatternMode(mode) {
            patternMode = mode;
            const btnSeq = document.getElementById('mode-seq');
            const btnWave = document.getElementById('mode-wave');

            if (mode === 'sequential') {
                TIMELINE = getSequentialTimeline();
                totalDuration = 5200;
                btnSeq.className = "px-3.5 py-1 rounded-full transition font-medium bg-white text-black";
                btnWave.className = "px-3.5 py-1 rounded-full transition font-medium text-neutral-400 hover:text-white";
            } else {
                TIMELINE = getWaveTimeline();
                totalDuration = 5000;
                btnWave.className = "px-3.5 py-1 rounded-full transition font-medium bg-white text-black";
                btnSeq.className = "px-3.5 py-1 rounded-full transition font-medium text-neutral-400 hover:text-white";
            }

            document.getElementById('scrubber').max = totalDuration;
            document.getElementById('total-time-display').innerText = `00:0${Math.floor(totalDuration/1000)}`;
            currentTime = 0;
            updateScene(0);
            play();
        }

        function toggleImageSet() {
            currentImageSet = currentImageSet === 'video' ? 'portfolio' : 'video';
            const label = document.getElementById('theme-label');
            label.innerText = currentImageSet === 'video' ? 'Visual Set: Apple Aesthetic' : 'Visual Set: Darshan Portfolio';
            
            // Refresh current timeline
            if (patternMode === 'sequential') TIMELINE = getSequentialTimeline();
            else TIMELINE = getWaveTimeline();

            // Clear cache so images re-render immediately
            for (let k in currentSlotContent) currentSlotContent[k] = null;
            updateScene(currentTime);
        }

        // Direct letter click interaction
        slots.forEach((slot) => {
            slot.addEventListener('click', () => {
                pause();
                const idx = parseInt(slot.dataset.index, 10);
                const isCurrentlyCard = slot.classList.contains('is-card');
                const cardConfig = calculateCardSize();
                const imgContainer = slot.querySelector('.char-image');
                const A = getAssets();

                if (isCurrentlyCard) {
                    slot.classList.remove('is-card');
                    slot.style.width = cardConfig.fontWidth;
                    slot.style.height = 'auto';
                    slot.style.margin = '0';
                    currentSlotContent[idx] = null;
                } else {
                    const chosenImage = [
                        A.portrait, A.flower, A.runner, A.water, A.stairs, A.ferry, A.tennis
                    ][idx];

                    slot.classList.add('is-card');
                    slot.style.width = `${cardConfig.size}px`;
                    slot.style.height = `${cardConfig.size}px`;
                    slot.style.margin = cardConfig.margin;
                    
                    imgContainer.style.width = `${cardConfig.size}px`;
                    imgContainer.style.height = `${cardConfig.size}px`;
                    imgContainer.innerHTML = chosenImage;
                    currentSlotContent[idx] = chosenImage;
                }
            });
        });

        // Event Listeners for scrubber
        const scrubberInput = document.getElementById('scrubber');
        scrubberInput.addEventListener('input', (e) => {
            pause();
            currentTime = parseInt(e.target.value, 10);
            updateScene(currentTime);
        });

        window.addEventListener('resize', () => {
            updateScene(currentTime);
        });

        // Mouse wheel scrub
        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > 5) {
                pause();
                currentTime = Math.max(0, Math.min(totalDuration, currentTime + (e.deltaY * 3)));
                updateScene(currentTime);
            }
        }, { passive: true });

        // Touch scrub
        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - touchStartX;
                touchStartX = e.touches[0].clientX;
                pause();
                currentTime = Math.max(0, Math.min(totalDuration, currentTime - (deltaX * 12)));
                updateScene(currentTime);
            }
        }, { passive: true });

        // Support direct phase URL parameter (e.g. ?mode=wave or ?letter=3)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'wave') {
            setPatternMode('wave');
        } else {
            setPatternMode('sequential');
        }

        if (urlParams.has('t')) {
            currentTime = parseInt(urlParams.get('t'), 10);
            pause();
            updateScene(currentTime);
        }

        // Start animation loop
        requestAnimationFrame((ts) => {
            lastTimestamp = ts;
            requestAnimationFrame(animationLoop);
        });
    </script>
</body>
</html>
