<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Darshan Naidu — Kinetic Typography Hero</title>
    <link href="/assets/images/672d25251d3eb0249521c21b_Fav%20icon.png" rel="shortcut icon" type="image/x-icon">
    <!-- GSAP 3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-text-size-adjust: 100%;
            text-rendering: optimizeLegibility;
            touch-action: manipulation;
        }

        .hero-stage {
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            background-color: #080808;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow: hidden;
        }

        .word-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 5.2vw, 76px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1;
            white-space: nowrap;
            color: #ffffff;
            position: relative;
            max-width: 90vw;
            max-width: 90dvw;
        }

        /* Mobile specific font tuning to prevent any edge clipping */
        @media (max-width: 768px) {
            .word-container {
                font-size: clamp(18px, 4.6vw, 28px);
                letter-spacing: -0.015em;
            }
        }

        @media (max-width: 480px) {
            .word-container {
                font-size: clamp(16px, 4.3vw, 20px);
                letter-spacing: -0.01em;
            }
        }

        @media (max-width: 360px) {
            .word-container {
                font-size: 15px;
                letter-spacing: 0;
            }
        }

        .char-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            vertical-align: middle;
            height: 1.24em;
            will-change: width, margin;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .char-space {
            display: inline-block;
            width: 0.30em;
            pointer-events: none;
            flex-shrink: 0;
        }

        .char-glyph {
            display: inline-block;
            line-height: 1;
            color: #ffffff;
            will-change: transform, opacity;
            pointer-events: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .image-tile {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            border-radius: 22%;
            -webkit-border-radius: 22%;
            overflow: hidden;
            pointer-events: none;
            will-change: transform, opacity, width, height;
            background-color: #080808;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 5;
            /* iOS Safari WebKit clipping fixes */
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        .image-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 22%;
            -webkit-border-radius: 22%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            .char-slot, .char-glyph, .image-tile {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="hero-stage">
        <div id="word" class="word-container" aria-label="Darshan Naidu">
            <!-- Darshan (indices 0 to 6) -->
            <span class="char-slot" data-index="0" data-char="D"><span class="char-glyph">D</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="1" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="2" data-char="r"><span class="char-glyph">r</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="3" data-char="s"><span class="char-glyph">s</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="4" data-char="h"><span class="char-glyph">h</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="5" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="6" data-char="n"><span class="char-glyph">n</span><div class="image-tile"><img src="" alt=""></div></span>

            <!-- Space separator -->
            <span class="char-space">&nbsp;</span>

            <!-- Naidu (indices 7 to 11) -->
            <span class="char-slot" data-index="7" data-char="N"><span class="char-glyph">N</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="8" data-char="a"><span class="char-glyph">a</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="9" data-char="i"><span class="char-glyph">i</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="10" data-char="d"><span class="char-glyph">d</span><div class="image-tile"><img src="" alt=""></div></span>
            <span class="char-slot" data-index="11" data-char="u"><span class="char-glyph">u</span><div class="image-tile"><img src="" alt=""></div></span>
        </div>
    </main>

    <script>
        // Only authentic Darshan photos from /darshan-images
        const IMAGES = {
            portrait: '/assets/images/darshan/darshan.jpeg',
            studio:   '/assets/images/darshan/IMG_E1906_Original.JPG',
            edit:     '/assets/images/darshan/IMG_8863-EDIT.jpg',
            shot1:    '/assets/images/darshan/IMG_1499.JPG',
            shot2:    '/assets/images/darshan/IMG_2461.JPG',
            shot3:    '/assets/images/darshan/IMG_3763.JPG',
            shot4:    '/assets/images/darshan/IMG_4192.JPG',
            shot5:    '/assets/images/darshan/IMG_4364.jpg',
            shot6:    '/assets/images/darshan/IMG_6965.jpg',
            shot7:    '/assets/images/darshan/IMG_7845.JPG',
            shot8:    '/assets/images/darshan/IMG_8213.jpg'
        };

        // Preload all assets to guarantee zero flicker
        function preloadAssets(urls, callback) {
            let loaded = 0;
            const keys = Object.keys(urls);
            const total = keys.length;
            keys.forEach(k => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded >= total) callback();
                };
                img.src = urls[k];
            });
        }

        const slots = document.querySelectorAll('.char-slot');
        let naturalWidths = [];
        let tileDimension = 0;
        let masterTimeline = null;

        // Measure natural rendered character widths accurately
        function measureLayout() {
            naturalWidths = [];
            slots.forEach(slot => {
                const glyph = slot.querySelector('.char-glyph');
                slot.style.width = 'auto';
                slot.style.margin = '0';
                glyph.style.transform = 'none';
                glyph.style.opacity = '1';
                const rect = glyph.getBoundingClientRect();
                // Sub-pixel precision rounded to 2 decimals to prevent iOS WebKit truncation jitter
                const exactWidth = Math.ceil(rect.width * 100) / 100;
                naturalWidths.push(exactWidth);
                slot.style.width = `${exactWidth}px`;
            });

            // Square squircle tile matches line height
            const sampleSlot = slots[0];
            const sampleRect = sampleSlot.getBoundingClientRect();
            tileDimension = Math.round(sampleRect.height);
        }

        // Helper to animate slot state (glyph vs card tile)
        function setSlotState(tl, index, config, position) {
            const slot = slots[index];
            const glyph = slot.querySelector('.char-glyph');
            const tile = slot.querySelector('.image-tile');
            const img = tile.querySelector('img');

            const naturalW = naturalWidths[index];
            const targetW = config.active ? tileDimension : naturalW;
            const duration = config.duration || 0.42;
            const ease = config.ease || "power2.out";

            // Mobile-aware card margin (2px on small screens, 3px on desktop)
            const marginValue = window.innerWidth < 480 ? 2 : 3;

            if (config.active && config.image) {
                tl.set(img, { attr: { src: config.image } }, position);

                // Slot width expansion
                tl.to(slot, {
                    width: targetW,
                    marginRight: marginValue,
                    marginLeft: marginValue,
                    duration: duration,
                    ease: ease
                }, position);

                // Glyph disappears
                tl.to(glyph, {
                    opacity: 0,
                    scale: 0.15,
                    duration: duration * 0.7,
                    ease: "power2.in"
                }, position);

                tl.set(tile, {
                    width: tileDimension,
                    height: tileDimension
                }, position);

                // Card tile pops in
                tl.to(tile, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position);

            } else {
                // Card tile shrinks down
                tl.to(tile, {
                    opacity: 0,
                    scale: 0.5,
                    duration: duration * 0.75,
                    ease: "power2.in"
                }, position);

                // Slot contracts to natural width
                tl.to(slot, {
                    width: targetW,
                    marginRight: 0,
                    marginLeft: 0,
                    duration: duration,
                    ease: ease
                }, position);

                // Glyph fades and scales back in
                tl.to(glyph, {
                    opacity: 1,
                    scale: 1,
                    duration: duration,
                    ease: ease
                }, position + (duration * 0.2));
            }
        }

        // Micro image-swap pop on active card
        function swapSlotImage(tl, index, newImage, position, duration = 0.28) {
            const slot = slots[index];
            const tile = slot.querySelector('.image-tile');
            const img = tile.querySelector('img');

            tl.to(tile, {
                scale: 0.88,
                duration: duration * 0.5,
                ease: "power1.in"
            }, position);

            tl.set(img, { attr: { src: newImage } }, position + (duration * 0.5));

            tl.to(tile, {
                scale: 1,
                duration: duration * 0.5,
                ease: "back.out(1.4)"
            }, position + (duration * 0.5));
        }

        // Build the Celebrations-style timeline for "Darshan Naidu":
        // D(0), a(1), r(2), s(3), h(4), a(5), n(6)  [space]  N(7), a(8), i(9), d(10), u(11)
        // Keeps the name readable at all times with balanced card clusters
        function buildTimeline() {
            if (masterTimeline) {
                masterTimeline.kill();
            }

            measureLayout();

            const tl = gsap.timeline({
                repeat: -1,
                repeatDelay: 1.8,
                defaults: { ease: "power2.out" }
            });

            // ----------------------------------------------------
            // PHASE A: Clean Opening (0.00s - 0.40s)
            // Complete word "Darshan Naidu" centered, stationary white on black
            // ----------------------------------------------------
            slots.forEach((slot, idx) => {
                const glyph = slot.querySelector('.char-glyph');
                const tile = slot.querySelector('.image-tile');
                tl.set(slot, { width: naturalWidths[idx], margin: 0 }, 0);
                tl.set(glyph, { opacity: 1, scale: 1 }, 0);
                tl.set(tile, { opacity: 0, scale: 0.6 }, 0);
            });

            // ----------------------------------------------------
            // PHASE B: First Image Insertion (0.40s - 1.20s)
            // Two photographic tiles appear near right side at i(9) and d(10)
            // Rest of "Darshan Na...u" remains clearly readable
            // ----------------------------------------------------
            setSlotState(tl, 9, { active: true, image: IMAGES.shot1, duration: 0.44 }, 0.40);
            setSlotState(tl, 10, { active: true, image: IMAGES.shot2, duration: 0.44 }, 0.48);

            // ----------------------------------------------------
            // PHASE C: Progressive Image Expansion & Rapid Swaps (1.20s - 2.15s)
            // Expands toward middle: a(8) in Naidu, n(6) in Darshan
            // Right-side tiles release, while i(9) swaps photos before resolving
            // ----------------------------------------------------
            swapSlotImage(tl, 9, IMAGES.shot3, 1.20, 0.26);
            setSlotState(tl, 8, { active: true, image: IMAGES.shot4, duration: 0.42 }, 1.26);
            setSlotState(tl, 6, { active: true, image: IMAGES.shot5, duration: 0.42 }, 1.36);

            // Release right tiles back to text so name remains readable
            setSlotState(tl, 10, { active: false, duration: 0.38 }, 1.48);
            setSlotState(tl, 9, { active: false, duration: 0.38 }, 1.58);

            // ----------------------------------------------------
            // PHASE D: Controlled Shift across First Name (2.15s - 3.10s)
            // Photographic flow moves leftward to s(3) and h(4) in Darshan
            // Tiles 8 and 6 release cleanly
            // ----------------------------------------------------
            setSlotState(tl, 8, { active: false, duration: 0.38 }, 2.05);
            setSlotState(tl, 6, { active: false, duration: 0.38 }, 2.12);

            setSlotState(tl, 3, { active: true, image: IMAGES.shot6, duration: 0.42 }, 2.12);
            setSlotState(tl, 4, { active: true, image: IMAGES.shot7, duration: 0.42 }, 2.22);
            swapSlotImage(tl, 3, IMAGES.shot8, 2.55, 0.26);

            // ----------------------------------------------------
            // PHASE E: Collapse to One Image (3.10s - 4.30s)
            // Collapse remaining tiles until only ONE remains immediately after initial letter 'D':
            // Letter a(1) in Darshan blooms with Darshan's portrait and holds
            // ----------------------------------------------------
            setSlotState(tl, 4, { active: false, duration: 0.38 }, 3.10);
            setSlotState(tl, 3, { active: false, duration: 0.38 }, 3.18);

            // Solo hero card holds right after initial letter 'D' (Celebrations Phase E)
            setSlotState(tl, 1, { active: true, image: IMAGES.portrait, duration: 0.46 }, 3.16);

            // ----------------------------------------------------
            // PHASE F: Final Reset (4.30s - 5.00s)
            // Clean transition revealing complete white word "Darshan Naidu"
            // ----------------------------------------------------
            setSlotState(tl, 1, { active: false, duration: 0.42 }, 4.30);

            // ----------------------------------------------------
            // PHASE G: Resting Hold (5.00s - 6.80s)
            // Clean stationary readable state before repeat
            // ----------------------------------------------------
            tl.to({}, { duration: 1.8 }, 4.90);

            masterTimeline = tl;
            return tl;
        }

        // Initialize once all Darshan photos are preloaded and fonts are ready
        preloadAssets(IMAGES, () => {
            const runInit = () => {
                buildTimeline();
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('seek')) {
                    masterTimeline.pause();
                    masterTimeline.seek(parseFloat(urlParams.get('seek')));
                }
            };

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(runInit);
            } else {
                runInit();
            }
        });

        // Recalculate accurately on window resize or mobile orientation change
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const progress = masterTimeline ? masterTimeline.progress() : 0;
                buildTimeline();
                if (masterTimeline) masterTimeline.progress(progress);
            }, 120);
        });

        // Space to pause/play; Tap to restart
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (masterTimeline) {
                    if (masterTimeline.paused()) masterTimeline.play();
                    else masterTimeline.pause();
                }
            }
        });

        document.querySelector('.hero-stage').addEventListener('click', () => {
            if (masterTimeline) masterTimeline.restart();
        });
    </script>
</body>
</html>
